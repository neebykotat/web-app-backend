<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluffyHost — Тест CORS</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        button { padding: 10px 16px; margin: 5px 5px 15px 0; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f4f4f5; font-weight: 500; }
        button:hover { background: #e4e4e7; }
        input { padding: 8px; width: 320px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
        pre { background: #18181b; color: #f4f4f5; padding: 16px; border-radius: 8px; overflow-x: auto; min-height: 120px; }
    </style>
</head>
<body>
    <h2>Проверка CORS для FluffyHost API</h2>
    <p>Текущий Origin страницы: <strong id="current-origin"></strong></p>

    <div>
        <button onclick="testGetPets()">1. GET /pets/ (Простой запрос)</button>
        <button onclick="testPostItem()">2. POST /items/ (Preflight OPTIONS + JSON)</button>
    </div>

    <div>
        <input type="text" id="jwt-token" placeholder="Вставьте access_token (необязательно)">
        <button onclick="testAuthMe()">3. GET /api/v1/users/me (С Credentials)</button>
    </div>

    <h3>Результат ответа:</h3>
    <pre id="output">Нажмите любую кнопку для отправки запроса...</pre>

    <script>
        const API_URL = "http://127.0.0.1:5005";
        document.getElementById("current-origin").textContent = window.location.origin;
        const output = document.getElementById("output");

        function logResult(title, status, data) {
            output.textContent = `[${title}]\nHTTP Статус: ${status}\n\nОтвет сервера:\n${JSON.stringify(data, null, 2)}`;
        }

        async function testGetPets() {
            try {
                const response = await fetch(`${API_URL}/pets/`, {
                    method: "GET"
                });
                const data = await response.json();
                logResult("GET /pets/", response.status, data);
            } catch (error) {
                output.textContent = `Ошибка CORS или сети:\n${error}`;
            }
        }

        async function testPostItem() {
            try {
                // Заголовок Content-Type: application/json провоцирует preflight OPTIONS-запрос
                const response = await fetch(`${API_URL}/items/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: "Игрушка для собаки",
                        price: 500,
                        tax: 50
                    })
                });
                const data = await response.json();
                logResult("POST /items/ (с предварительным OPTIONS)", response.status, data);
            } catch (error) {
                output.textContent = `Ошибка CORS или сети:\n${error}`;
            }
        }

        async function testAuthMe() {
            const token = document.getElementById("jwt-token").value.trim();
            try {
                const response = await fetch(`${API_URL}/api/v1/users/me`, {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                const data = await response.json();
                logResult("GET /api/v1/users/me", response.status, data);
            } catch (error) {
                output.textContent = `Ошибка CORS или сети:\n${error}`;
            }
        }
    </script>
</body>
</html>
